services:

  # ─────────────────────────────────────────────
  # Entorno principal: Jupyter + PySpark + Selenium
  # ─────────────────────────────────────────────
  workspace:
    build: .
    container_name: BigData_workspace
    ports:
 HEAD
      - "8888:8888"
      - "6080:6080"
      - "4040:4040"
=======
      - "8888:8888"   # Jupyter Lab
      - "6080:6080"   # Visualizador VNC (scraping dinamico)
      - "4040:4040"   # Spark UI
origin/main
    volumes:
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=bigdata
      - JUPYTER_ALLOW_INSECURE_WRITES=true
      - DISPLAY=:99
    shm_size: "2gb"
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    user: root
    restart: always
    depends_on:
      - mongodb
    networks:
      - bigdata_net

  # ─────────────────────────────────────────────
  # Base de Datos NoSQL local (MongoDB)
  # ─────────────────────────────────────────────
  mongodb:
    image: mongo:latest
    container_name: BigData_MongoDB
    ports:
 HEAD
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb+srv://usuario:password@cluster0.kthdyh1.mongodb.net/?retryWrites=true&w=majority
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - VC_NODE_TLS_REJECT_UNAUTHORIZED=0
    dns:
      - 8.8.8.8
      - 8.8.4.4
=======
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
 origin/main
    restart: always
    networks:
      - bigdata_net

  # ─────────────────────────────────────────────
  # Visualizador de MongoDB (Mongo Express)
  # ─────────────────────────────────────────────
  admin-db:
    image: mongo-express
    container_name: BigData_Visualizer
    ports:
      - "8081:8081"
    environment:
      # Por defecto, conecta a la BD local de tus compañeros.
      # Si prefieres usar TU base de datos en la nube (Atlas), comenta la linea de abajo
      # y descomenta la tuya, pero reemplaza TU_PASSWORD_AQUI.
      - ME_CONFIG_MONGODB_URL=mongodb://mongodb:27017/
      # - ME_CONFIG_MONGODB_URL=mongodb+srv://BenjaminRamirez:TU_PASSWORD_AQUI@cluster0.kek1o3u.mongodb.net/TiendaBigData?retryWrites=true&w=majority
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    dns:
      - 8.8.8.8
    restart: always
    depends_on:
      - mongodb
    networks:
      - bigdata_net

  # ─────────────────────────────────────────────
  # Gestor de archivos web
  # ─────────────────────────────────────────────
  filebrowser:
    image: filebrowser/filebrowser
    container_name: BigData_FileBrowser
    ports:
      - "8082:80"
    volumes:
      - .:/srv
    restart: always
    networks:
      - bigdata_net

volumes:
  mongo_data:

networks:
  bigdata_net:
    driver: bridge
HEAD
    name: BigData_Network_UCN
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "true"
=======
    name: BigData_Network_UCN
origin/main
