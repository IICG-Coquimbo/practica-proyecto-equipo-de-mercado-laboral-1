services:

  # ─────────────────────────────────────────────
  # Entorno principal: Jupyter + PySpark + Selenium
  # ─────────────────────────────────────────────
  workspace:
    build: .
    container_name: BigData_workspace
    ports:
      - "8501:8501" # Acceso a Streamlite
      - "8888:8888"   # Jupyter Lab
      - "6080:6080"   # Visualizador VNC (scraping dinamico)
      - "4040:4040"   # Spark UI
    volumes:
      - .:/home/jovyan/work
    env_file:
      - .env          # NUEVO: Inyectamos las credenciales de Atlas al entorno de Python
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=bigdata
      - JUPYTER_ALLOW_INSECURE_WRITES=true
      - DISPLAY=:99
    shm_size: "2gb"
    dns:
      - 8.8.8.8
    user: root
    restart: always
    # ELIMINADO: depends_on: mongodb (porque ya no existe localmente)
    networks:
      - bigdata_net

  # ─────────────────────────────────────────────
  # Visualizador de MongoDB (Mongo Express conectado a Atlas)
  # ─────────────────────────────────────────────
  admin-db:
    image: mongo-express
    container_name: BigData_Visualizer
    ports:
      - "8081:8081"
    env_file:
      - .env          # NUEVO: Mongo Express también necesita leer el .env
    environment:
      # NUEVO: Llama dinámicamente a la clave MONGO_URI que vive en tu archivo .env
      - ME_CONFIG_MONGODB_URL=${MONGO_URI}
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    dns:
      - 8.8.8.8
    restart: always
    # ELIMINADO: depends_on: mongodb
    networks:
      - bigdata_net

  # ─────────────────────────────────────────────
  # Gestor de archivos web
  # ─────────────────────────────────────────────
  filebrowser:
    image: filebrowser/filebrowser
    container_name: BigData_FileBrowser
    ports:
      - "8082:80"
    volumes:
      - .:/srv
    restart: always
    networks:
      - bigdata_net

networks:
  bigdata_net:
    driver: bridge
    name: BigData_Network_UCN

# ELIMINADO: La sección "volumes: mongo_data" desaparece por completo.